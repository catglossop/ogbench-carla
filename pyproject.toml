[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ogbench"
version = "1.2.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mujoco >= 3.1.6",
    "dm_control >= 1.0.20",
    "gymnasium[mujoco]",
    "ml-collections>=1.0.0",
    "wandb>=0.26.0",
    "pytest>=9.0.3",
    "setuptools>=69,<81",
    "carla",
    "jax[cuda12]>=0.5.3",
]
authors = [
    { name = "Seohong Park" },
    { name = "Kevin Frans" },
    { name = "Benjamin Eysenbach" },
    { name = "Sergey Levine" },
]
maintainers = [
    { name = "Seohong Park", email = "seohong@berkeley.edu" }
]
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["description"]

[project.optional-dependencies]
train-gpu = [
    "jax[cuda12] >= 0.4.26",
    "flax >= 0.8.4",
    "distrax >= 0.1.5",
    "ml_collections",
    "matplotlib",
    "moviepy",
    "wandb",
]
train-tpu = [
    "jax[tpu]",
    "flax >= 0.8.4",
    "distrax >= 0.1.5",
    "ml_collections",
    "matplotlib",
    "moviepy",
    "wandb", 
]
carla = [
    "bench2drive @ git+https://github.com/catglossop/Bench2Drive.git",
    "openpi @ git+https://github.com/catglossop/steervla-pi.git",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "ruff",
]
all-gpu = [
    "ogbench[train-gpu,dev,carla]",
]
all-tpu = [
    "ogbench[train-tpu,dev,carla]",
]

[project.urls]
Home = "https://github.com/seohongpark/ogbench"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "single"
